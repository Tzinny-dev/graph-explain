[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-explain"
version = "0.7.2"
description = "Explainability library for graph-based models (GNN)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "graph-explain contributors" }]
keywords = [
    "gnn",
    "explainability",
    "xai",
    "graph",
    "neural-networks",
    "interpretability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "matplotlib>=3.6",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/Tzinny-dev/graph-explain"
Repository = "https://github.com/Tzinny-dev/graph-explain"
Documentation = "https://github.com/Tzinny-dev/graph-explain#readme"

[project.optional-dependencies]
pyg = ["torch>=2.0", "torch-geometric>=2.5"]
dgl = ["torch>=2.0", "dgl>=2.0"]
interactive = ["plotly>=5.15", "pyvis>=0.3"]
all = ["torch>=2.0", "torch-geometric>=2.5", "dgl>=2.0", "plotly>=5.15", "pyvis>=0.3"]
dev = ["pytest>=7.0", "ruff>=0.5", "build>=1.0"]
docs = ["sphinx>=7.2", "sphinx-rtd-theme>=2.0"]
publish = ["twine>=5.0"]

[project.scripts]
graph-explain = "graph_explain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graph_explain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"