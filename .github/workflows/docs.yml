name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ".[pyg,docs]"
      - name: Fetch coverage artifact from the latest CI run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # download-artifact@v4 only sees artifacts of this run, but coverage
          # is produced by the separate `ci` workflow, so pull it from its
          # latest successful run on main.
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')"
          echo "Fetching coverage artifact from ci run $RUN_ID"
          rm -rf coverage-report && mkdir -p coverage-report
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name coverage --dir coverage-report
          test -f coverage-report/docs/_static/badges/coverage.svg
      - name: Copy coverage badge into docs
        run: |
          if [ -f coverage-report/docs/_static/badges/coverage.svg ]; then
            mkdir -p docs/_static/badges
            cp coverage-report/docs/_static/badges/coverage.svg docs/_static/badges/coverage.svg
            echo "coverage badge included"
          else
            echo "::warning::coverage badge unavailable (no ci artifact yet); building docs without it"
          fi
      - name: Build docs
        run: python -m sphinx -b html docs docs/_build/html
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
