name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (pyg + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[pyg,dev]"
      - name: CLI smoke
        run: graph-explain --version
      - name: Tests
        run: python -m pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ".[pyg,docs]"
      - name: Build docs
        run: python -m sphinx -b html docs docs/_build/html

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify wheel installs and imports
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install dist/*.whl
          python -c "import graph_explain; assert graph_explain.__version__"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  dgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DGL stack (torch 2.2.1 + DGL 2.1.0)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dgl==2.1.0 "numpy<2" "scipy<1.14" "pandas" \
            "torchdata==0.7.1" "torch-geometric==2.6.1" matplotlib networkx \
            setuptools packaging
      - name: Install package (no deps)
        run: python -m pip install -e ".[dev]" --no-deps
      - name: Tests
        run: python -m pytest -q