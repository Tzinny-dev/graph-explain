name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ruff mypy
      - name: Ruff (lint + format)
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
      - name: mypy (static typing)
        run: |
          # mypy needs the real typing of torch/pyg; CPU wheels keep it light
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy networkx matplotlib torch-geometric
          python -m pip install -e . --no-deps
          mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (pyg + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[pyg,dev]"
      - name: CLI smoke
        run: graph-explain --version
      - name: Tests
        run: |
          python -m pytest -q --junitxml=pytest-results.xml
      - name: Test summary
        if: always()
        run: |
          echo "### 🧪 Test results — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'failures="0"' pytest-results.xml && grep -q 'errors="0"' pytest-results.xml; then
            echo "✅ All tests passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ There are failing tests." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (pyg + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[pyg,dev]"
      - name: Tests with coverage (branch coverage, threshold from pyproject)
        run: |
          python -m pytest -q --cov=graph_explain --cov-branch \
            --cov-report=term-missing --cov-report=xml --cov-report=json
      - name: Coverage summary
        run: |
          echo "### 📊 Coverage (Python 3.12)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report | sed -n '/^TOTAL/p' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch coverage, threshold enforced by \`coverage.report.fail_under\` (pyproject.toml)." >> "$GITHUB_STEP_SUMMARY"
      - name: Generate SVG badge
        if: hashFiles('coverage.json') != ''
        run: |
          mkdir -p docs/_static/badges
          python - <<'PY'
          import json

          pct = round(json.load(open("coverage.json"))["totals"]["percent_covered"])
          pct = max(0, min(pct, 100))
          # shields-style fills per threshold
          fills = [(90, "#4c1"), (80, "#97ca00"), (70, "#a4a61d"), (50, "#fe7d37")]
          fill = next((c for threshold, c in fills if pct >= threshold), "#e05d44")
          label, value = "coverage", f"{pct}%"

          def w(s):
              # rough monospace width metric (shields.io-like)
              return 6 * len(s) + 10

          width = w(label) + w(value)
          lr = w(label) + 6
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="20" role="img" aria-label="{label}: {value}">
          <title>{label}: {value}</title>
          <linearGradient id="s" x2="0" y2="100%">
            <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
            <stop offset="1" stop-opacity=".1"/>
          </linearGradient>
          <clipPath id="r"><rect width="{width}" height="20" rx="3" fill="#fff"/></clipPath>
          <g clip-path="url(#r)">
            <rect width="{w(label)}" height="20" fill="#555"/>
            <rect x="{w(label)}" width="{w(value)}" height="20" fill="{fill}"/>
            <rect width="{width}" height="20" fill="url(#s)"/>
          </g>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
            <text x="{w(label) // 2}" y="14" fill="#010101" fill-opacity=".3">{label}</text>
            <text x="{w(label) // 2}" y="13">{label}</text>
            <text x="{lr + w(value) // 2}" y="14" fill="#010101" fill-opacity=".3">{value}</text>
            <text x="{lr + w(value) // 2}" y="13">{value}</text>
          </g>
          </svg>'''
          open("docs/_static/badges/coverage.svg", "w").write(svg)
          print(f"coverage badge: {pct}% ({fill})")
          PY
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json
            docs/_static/badges/coverage.svg
          if-no-files-found: warn

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ".[pyg,docs]"
      - name: Build docs
        run: python -m sphinx -b html docs docs/_build/html

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify wheel installs and imports
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install dist/*.whl
          python -c "import graph_explain; assert graph_explain.__version__"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  dgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DGL stack (torch 2.2.1 + DGL 2.1.0)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dgl==2.1.0 "numpy<2" "scipy<1.14" "pandas" \
            "torchdata==0.7.1" "torch-geometric==2.6.1" matplotlib networkx \
            setuptools packaging
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
